<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Weather App</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #1a6fa8;
    --sky-light: #5aaddf;
    --bg: #0d1b2a;
    --surface: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.12);
    --text: #e8f4fd;
    --muted: rgba(232,244,253,0.55);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  /* Ambient background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 400px; height: 400px;
    background: rgba(26, 111, 168, 0.25);
    top: -100px; right: -100px;
  }
  body::after {
    width: 350px; height: 350px;
    background: rgba(90, 173, 223, 0.15);
    bottom: -80px; left: -80px;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid var(--border);
    border-radius: 28px;
    padding: 28px;
    backdrop-filter: blur(20px);
  }

  /* Search */
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  input {
    flex: 1;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--sky-light); }

  button {
    background: var(--sky);
    border: none;
    border-radius: 12px;
    padding: 12px 18px;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover  { background: var(--sky-light); }
  button:active { transform: scale(0.96); }

  /* Error */
  .error {
    font-size: 13px;
    color: #f08080;
    margin-bottom: 16px;
    text-align: center;
    display: none;
  }

  /* Main weather */
  .weather { display: none; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .location {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .city-name {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .main-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .temp {
    font-family: 'DM Serif Display', serif;
    font-size: 72px;
    line-height: 1;
    letter-spacing: -2px;
  }
  .temp sup { font-size: 28px; vertical-align: super; }

  .icon-desc { text-align: right; }
  .weather-icon { font-size: 52px; line-height: 1; margin-bottom: 4px; }
  .desc {
    font-size: 13px;
    color: var(--muted);
    text-transform: capitalize;
  }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.04em; }
  .stat-value { font-size: 16px; font-weight: 500; }

  /* 5-day forecast */
  .forecast-title {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .forecast {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .forecast::-webkit-scrollbar { display: none; }

  .fday {
    flex: 0 0 68px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
  }
  .fday-name  { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .fday-icon  { font-size: 22px; margin-bottom: 6px; }
  .fday-temp  { font-size: 14px; font-weight: 500; }
  .fday-low   { font-size: 11px; color: var(--muted); }

  /* Loader */
  .loader { display: none; text-align: center; padding: 20px 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<div class="card">
  <!-- Search -->
  <div class="search-row">
    <input type="text" id="cityInput" placeholder="Search city…" onkeydown="if(event.key==='Enter') getWeather()"/>
    <button onclick="getWeather()">Search</button>
  </div>

  <div class="error" id="error">City not found. Please try again.</div>
  <div class="loader" id="loader">Fetching weather…</div>

  <!-- Weather display -->
  <div class="weather" id="weather">
    <div class="location" id="country"></div>
    <div class="city-name" id="cityName"></div>

    <div class="main-row">
      <div class="temp" id="temp"></div>
      <div class="icon-desc">
        <div class="weather-icon" id="icon"></div>
        <div class="desc" id="desc"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Feels like</div>
        <div class="stat-value" id="feels"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Humidity</div>
        <div class="stat-value" id="humidity"></div>
      </div>
      <div class="stat">
        <div class="stat-label">Wind</div>
        <div class="stat-value" id="wind"></div>
      </div>
    </div>

    <div class="forecast-title">5-day forecast</div>
    <div class="forecast" id="forecast"></div>
  </div>
</div>

<script>
  // Open-Meteo: 100% free, no API key, no CORS issues, true 7-day forecast
  const GEO_URL  = 'https://geocoding-api.open-meteo.com/v1/search';
  const FC_URL   = 'https://api.open-meteo.com/v1/forecast';

  const WMO = {
    0:['☀️','Clear sky'], 1:['🌤️','Mainly clear'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
    45:['🌫️','Fog'], 48:['🌫️','Icy fog'],
    51:['🌦️','Light drizzle'], 53:['🌧️','Drizzle'], 55:['🌧️','Heavy drizzle'],
    61:['🌦️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
    71:['🌨️','Light snow'], 73:['❄️','Snow'], 75:['❄️','Heavy snow'], 77:['❄️','Snow grains'],
    80:['🌦️','Rain showers'], 81:['🌧️','Heavy showers'], 82:['🌧️','Violent showers'],
    85:['🌨️','Snow showers'], 86:['❄️','Heavy snow showers'],
    95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm + hail'], 99:['⛈️','Heavy thunderstorm'],
  };

  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function wmo(code) { return WMO[code] || ['🌡️','Unknown']; }
  function show(id)  { document.getElementById(id).style.display = 'block'; }
  function hide(id)  { document.getElementById(id).style.display = 'none';  }
  function txt(id,v) { document.getElementById(id).textContent = v; }

  async function getWeather() {
    const city = document.getElementById('cityInput').value.trim();
    if (!city) return;
    hide('weather'); hide('error'); show('loader');

    try {
      // Step 1: geocode city name → lat/lon
      const geoRes  = await fetch(`${GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
      const geoData = await geoRes.json();
      if (!geoData.results?.length) throw new Error('Not found');

      const { latitude, longitude, name, country } = geoData.results[0];

      // Step 2: fetch weather + forecast
      const params = new URLSearchParams({
        latitude, longitude,
        current: 'temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code',
        daily:   'weather_code,temperature_2m_max,temperature_2m_min',
        timezone: 'auto',
        forecast_days: 7
      });
      const fcRes  = await fetch(`${FC_URL}?${params}`);
      const fc     = await fcRes.json();

      hide('loader');

      // Current
      const cur = fc.current;
      const [curEmoji, curDesc] = wmo(cur.weather_code);
      txt('country',  country);
      txt('cityName', name);
      txt('temp',     `${Math.round(cur.temperature_2m)}°`);
      txt('feels',    `${Math.round(cur.apparent_temperature)}°`);
      txt('humidity', `${cur.relative_humidity_2m}%`);
      txt('wind',     `${Math.round(cur.wind_speed_10m / 3.6)} m/s`);
      txt('desc',     curDesc);
      document.getElementById('icon').textContent = curEmoji;

      // 5-day forecast (skip today → index 1–5)
      const forecastEl = document.getElementById('forecast');
      forecastEl.innerHTML = '';
      fc.daily.time.slice(1, 6).forEach((dateStr, i) => {
        const idx  = i + 1;
        const dow  = DAYS[new Date(dateStr).getDay()];
        const [em] = wmo(fc.daily.weather_code[idx]);
        const div  = document.createElement('div');
        div.className = 'fday';
        div.innerHTML = `
          <div class="fday-name">${dow}</div>
          <div class="fday-icon">${em}</div>
          <div class="fday-temp">${Math.round(fc.daily.temperature_2m_max[idx])}°</div>
          <div class="fday-low">${Math.round(fc.daily.temperature_2m_min[idx])}°</div>`;
        forecastEl.appendChild(div);
      });

      show('weather');

    } catch {
      hide('loader');
      show('error');
    }
  }
</script>
</body>
</html>
